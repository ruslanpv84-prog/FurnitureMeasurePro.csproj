name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 7.0

    - name: Build
      run: dotnet publish FurnitureMeasurePro/-c Release -r win-x64 --self-contained true

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: FurnitureMeasurePro
        path: bin/Release/net7.0-windows/win-x64/publish/
